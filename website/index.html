<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyTool · Windows 效率工具箱</title>
    <meta
      name="description"
      content="EasyTool —— Windows 效率工具箱：剪贴板历史、AI 额度监控、表情面板、Everything 文件秒搜。模块化架构，本地优先，一个热键全部唤出。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310b981'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='700' fill='%23fafafa' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E"
    />
    <script>
      try {
        var t = localStorage.getItem("et-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
