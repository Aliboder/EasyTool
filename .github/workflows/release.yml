name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (npm)
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate latest.json for updater
        shell: pwsh
        run: |
          # 读取版本号
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Write-Host "Version: $version"
          
          # 找到安装包和签名文件
          $setupFile = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          $sigFile = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*.sig" | Select-Object -First 1
          
          if (-not $setupFile -or -not $sigFile) {
            Write-Error "未找到安装包或签名文件"
            exit 1
          }
          
          Write-Host "Setup: $($setupFile.Name)"
          Write-Host "Signature: $($sigFile.Name)"
          
          # 读取签名内容
          $signature = Get-Content $sigFile.FullName -Raw
          
          # 生成下载 URL
          $downloadUrl = "https://github.com/Aliboder/EasyTool/releases/download/v$version/$($setupFile.Name)"
          
          # 创建 latest.json
          $latest = @{
            version = "v$version"
            notes = "Version $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $downloadUrl
              }
            }
          }
          
          $latest | ConvertTo-Json -Depth 10 | Set-Content -Path "latest.json"
          Write-Host "Generated latest.json:"
          Get-Content latest.json

      - name: Upload latest.json to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json
